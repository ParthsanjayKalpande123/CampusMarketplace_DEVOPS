# =============================================================================
# .github/workflows/cd.yml — Continuous Deployment (Blue-Green Strategy)
#
# Triggers:
#   - Push to the main branch ONLY
#
# Pipeline:
#   1. test        — Calls ci.yml (reusable workflow). Gate for deployment.
#   2. build-push  — Build Docker image, tag with git SHA + latest, push to ECR.
#   3. deploy      — Blue-Green deployment via Ansible:
#                    a) Deploy new image to GREEN on localhost:3002
#                    b) Health-check GREEN while BLUE serves on :3000
#                    c) Update BLUE and verify it before stopping GREEN
#                    d) Rollback: if GREEN health-check fails, keep BLUE running
#
# Deployment Strategy: Blue-Green
#   BLUE  slot → live application (ports 3000/3001)
#   GREEN slot → isolated candidate (localhost:3002, not publicly exposed)
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID       — IAM user with ECR push and EC2 describe permissions
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION              — e.g. ap-south-1
#   ECR_REPOSITORY          — ECR repository name (e.g. campus-marketplace)
#   EC2_HOST                — Public IP or DNS of the EC2 instance
#   EC2_SSH_KEY             — PEM private key content for SSH access
#   JWT_SECRET              — Production JWT secret (min 32 chars)
#   MONGODB_URI             — mongodb://mongodb:27017/campus_marketplace
#   CORS_ORIGIN             — e.g. https://your-domain.com
#   MONGO_ROOT_PASSWORD     — MongoDB root password for production
#   KIBANA_ENCRYPTION_KEY   — Optional stable key (at least 32 characters); generated and
#                             persisted on EC2 when omitted
#   GEMINI_API_KEY          — Optional; enables Gemini-powered marketplace features
# =============================================================================

name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Run full test suite (reuses ci.yml)
  # ---------------------------------------------------------------------------
  test:
    name: Test Gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Job 2 — Build Docker image and push to Amazon ECR
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG:      ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg GIT_SHA="${IMAGE_TAG}" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ---------------------------------------------------------------------------
  # Job 3 — Blue-Green Deploy to EC2 via Ansible
  # ---------------------------------------------------------------------------
  deploy:
    name: Blue-Green Deploy to EC2
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python, Ansible, and boto3
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible boto3 botocore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Write SSH private key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key.pem
          chmod 600 /tmp/deploy_key.pem

      - name: Write dynamic Ansible inventory
        run: |
          cat > ansible/inventory/hosts.ini <<EOF
          [campus_marketplace]
          ${{ secrets.EC2_HOST }} ansible_user=ec2-user ansible_ssh_private_key_file=/tmp/deploy_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=4'
          EOF

      # -----------------------------------------------------------------------
      # Blue-Green Step 1 — Deploy GREEN candidate on localhost:3002
      # -----------------------------------------------------------------------
      - name: "[Blue-Green] Deploy GREEN slot"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA::7}"
          ansible-playbook ansible/playbook.yml \
            -i ansible/inventory/hosts.ini \
            --extra-vars "\
              ecr_registry=${ECR_REGISTRY} \
              ecr_repository=${{ secrets.ECR_REPOSITORY }} \
              image_tag=${IMAGE_TAG} \
              aws_region=${{ secrets.AWS_REGION }} \
              jwt_secret='${{ secrets.JWT_SECRET }}' \
              mongodb_uri='${{ secrets.MONGODB_URI }}' \
              cors_origin='${{ secrets.CORS_ORIGIN }}' \
              mongo_root_password='${{ secrets.MONGO_ROOT_PASSWORD }}' \
              kibana_encryption_key='${{ secrets.KIBANA_ENCRYPTION_KEY }}' \
              gemini_api_key="${GEMINI_API_KEY}" \
              deploy_slot=green \
              app_port=3002"

      # -----------------------------------------------------------------------
      # Blue-Green Step 2 — Health-check GREEN over SSH before promotion
      # -----------------------------------------------------------------------
      - name: "[Blue-Green] Health-check GREEN slot"
        id: green-health
        run: |
          for i in {1..6}; do
            STATUS=$(ssh -i /tmp/deploy_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ec2-user@${{ secrets.EC2_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/api/v1/health" 2>/dev/null || true)
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "GREEN slot is healthy!"
              echo "green_healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 10
          done
          echo "GREEN health-check FAILED — will rollback"
          echo "green_healthy=false" >> $GITHUB_OUTPUT
          exit 1

      # -----------------------------------------------------------------------
      # Blue-Green Step 3 — Update live BLUE after GREEN passes its health check
      # -----------------------------------------------------------------------
      - name: "[Blue-Green] Promote tested image to BLUE"
        if: steps.green-health.outputs.green_healthy == 'true'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${GITHUB_SHA::7}"
          ansible-playbook ansible/playbook.yml \
            -i ansible/inventory/hosts.ini \
            --extra-vars "\
              ecr_registry=${ECR_REGISTRY} \
              ecr_repository=${{ secrets.ECR_REPOSITORY }} \
              image_tag=${IMAGE_TAG} \
              aws_region=${{ secrets.AWS_REGION }} \
              jwt_secret='${{ secrets.JWT_SECRET }}' \
              mongodb_uri='${{ secrets.MONGODB_URI }}' \
              cors_origin='${{ secrets.CORS_ORIGIN }}' \
              mongo_root_password='${{ secrets.MONGO_ROOT_PASSWORD }}' \
              kibana_encryption_key='${{ secrets.KIBANA_ENCRYPTION_KEY }}' \
              gemini_api_key="${GEMINI_API_KEY}" \
              deploy_slot=blue \
              app_port=3000 \
              teardown_old_slot=true"

      # -----------------------------------------------------------------------
      # Blue-Green Step 4 — Rollback: stop GREEN if health-check failed
      # -----------------------------------------------------------------------
      - name: "[Blue-Green] ROLLBACK — Stop GREEN, keep BLUE live"
        if: failure() && steps.green-health.outputs.green_healthy != 'true'
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook ansible/playbook.yml \
            -i ansible/inventory/hosts.ini \
            --extra-vars "deploy_slot=green teardown_only=true"
          echo "ROLLBACK COMPLETE — BLUE slot remains live on port 3000"

      # -----------------------------------------------------------------------
      # Final health-check on LIVE BLUE slot (port 3000)
      # -----------------------------------------------------------------------
      - name: "[Blue-Green] Final verification — LIVE slot on port 3000"
        if: steps.green-health.outputs.green_healthy == 'true'
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            "http://${{ secrets.EC2_HOST }}:3000/api/v1/health" \
            | python3 -m json.tool
          echo "Blue-Green deployment successful. LIVE on port 3000."

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key.pem
