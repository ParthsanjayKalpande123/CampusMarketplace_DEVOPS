# =============================================================================
# .github/workflows/ci.yml — Continuous Integration + DevSecOps
#
# Triggers:
#   - Every push to any branch
#   - Every pull request targeting main
#   - workflow_call (allows cd.yml to reuse this job)
#
# Jobs:
#   test          — Install deps, run the full Jest test suite against a
#                   real MongoDB service container (not mock)
#   security-scan — DevSecOps: npm audit (dependency CVEs) +
#                   Trivy (container image vulnerability scan)
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_call:          # Allows cd.yml to call this workflow directly
    outputs:
      outcome:
        description: "Test outcome"
        value: ${{ jobs.test.outputs.outcome }}



jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    outputs:
      outcome: ${{ steps.run-tests.outcome }}

    strategy:
      matrix:
        node-version: ["22"]   # Pin to Node.js LTS

    # MongoDB service container — mirrors the real production DB engine
    services:
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        id: run-tests
        run: npm test -- --runInBand --forceExit
        env:
          NODE_ENV:        test
          MONGODB_URI:     mongodb://localhost:27017/campus_marketplace_test
          JWT_SECRET:      ci-test-jwt-secret-long-enough-32characters!
          JWT_EXPIRES_IN:  1h
          COOKIE_SECURE:   "false"
          COOKIE_SAME_SITE: lax
          LOG_LEVEL:       error
          PORT:            3001

  # ---------------------------------------------------------------------------
  # DevSecOps — Security Scanning (runs in parallel with tests)
  # ---------------------------------------------------------------------------
  security-scan:
    name: DevSecOps — Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Step 1 — Dependency vulnerability audit (npm audit)
      # -----------------------------------------------------------------------
      - name: NPM Audit — dependency CVE scan
        run: |
          npm audit --audit-level=high --json > npm-audit-report.json || true
          echo "=== NPM Audit Summary ==="
          npm audit --audit-level=high || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 14

      # -----------------------------------------------------------------------
      # Step 2 — Container image vulnerability scan (Trivy)
      # -----------------------------------------------------------------------
      - name: Build Docker image for scanning
        run: docker build -t campus-marketplace:scan-${{ github.sha }} .

      # Trivy scan — table output printed directly in job log
      - name: Run Trivy container vulnerability scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-marketplace:scan-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"           # Don't fail build — report only

      # Trivy scan — JSON format saved as artifact for download
      - name: Run Trivy container vulnerability scan (artifact)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-marketplace:scan-${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-results.json
          retention-days: 14

      - name: Clean up scan image
        if: always()
        run: docker rmi campus-marketplace:scan-${{ github.sha }} || true
