apiVersion: v1
kind: ConfigMap
metadata:
  name: campus-marketplace-config
  namespace: campus-marketplace
data:
  NODE_ENV: "production"
  PORT: "3000"
  ADMIN_PORT: "3001"
  MONGODB_URI: "mongodb://mongodb:27017/campus_marketplace"
  JWT_EXPIRES_IN: "7d"
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: "lax"
  CORS_ORIGIN: "http://localhost:3000"
  LOG_LEVEL: "info"
  GEMINI_MODEL: "gemini-3.8-flash"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: campus-marketplace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: campus-marketplace
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: campus-marketplace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7-jammy
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-marketplace
  namespace: campus-marketplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-marketplace
  template:
    metadata:
      labels:
        app: campus-marketplace
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: campus-marketplace:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: campus-marketplace-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campus-marketplace-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: campus-marketplace-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: campus-marketplace
  namespace: campus-marketplace
spec:
  type: ClusterIP
  selector:
    app: campus-marketplace
  ports:
    - name: http
      port: 3000
      targetPort: http
