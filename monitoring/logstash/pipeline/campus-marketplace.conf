# =============================================================================
# Logstash pipeline — Campus Marketplace
#
# Input:  Filebeat beats input (port 5044)
# Filter: Parse JSON structured logs from the Node.js app
# Output: Elasticsearch index "campus-marketplace-logs-*"
# =============================================================================

input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs from Winston logger
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }

    mutate {
      add_field => {
        "log_level"    => "%{[parsed][level]}"
        "log_message"  => "%{[parsed][message]}"
        "service_name" => "%{[parsed][service]}"
      }
      remove_field => ["message", "parsed"]
    }
  }

  # Add geo-IP enrichment for request IPs (optional)
  if [parsed][ip] {
    geoip {
      source => "[parsed][ip]"
    }
  }
}

output {
  elasticsearch {
    hosts          => ["elasticsearch:9200"]
    index          => "campus-marketplace-logs-%{+YYYY.MM.dd}"
    template_name  => "campus-marketplace"
    template_overwrite => true
  }

  # Debug output — remove in production
  stdout {
    codec => rubydebug
  }
}
