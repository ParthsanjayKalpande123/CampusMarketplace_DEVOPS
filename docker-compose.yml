# =============================================================================
# docker-compose.yml — Local Development
#
# Services:
#   app     — Campus Marketplace Node.js container (built from local Dockerfile)
#   mongodb — MongoDB 7 container with persistent named volume
#
# Usage:
#   Start:   docker compose up --build
#   Stop:    docker compose down
#   Logs:    docker compose logs -f app
#   DB:      docker compose exec mongodb mongosh campus_marketplace
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Application — Campus Marketplace
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: production
    container_name: campus_marketplace_app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      NODE_ENV:        development
      PORT:            3000
      ADMIN_PORT:      3001
      # MongoDB service hostname matches the service name below
      MONGODB_URI:     mongodb://mongodb:27017/campus_marketplace
      # Override JWT_SECRET for local dev — ALWAYS change in production
      JWT_SECRET:      ${JWT_SECRET:-local_dev_secret_replace_before_production_32ch}
      JWT_EXPIRES_IN:  ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE:   "false"
      COOKIE_SAME_SITE: lax
      CORS_ORIGIN:     ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL:       ${LOG_LEVEL:-info}
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-}
      GEMINI_MODEL:    ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campus_net
    # Named volumes are not used for the app (stateless by design — LOCK-4)

  # ---------------------------------------------------------------------------
  # MongoDB 7 — Persistent storage
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: campus_marketplace_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No ports exposed externally — app accesses via internal network only
    # Uncomment the next line ONLY for local debugging:
    # ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: campus_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Grafana — Metrics visualisation dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: campus_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Elasticsearch — Log storage for ELK stack
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: campus_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type:            single-node
      xpack.security.enabled:    "false"
      ES_JAVA_OPTS:              "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - campus_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Logstash — Log processing pipeline
  # ---------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: campus_logstash
    restart: unless-stopped
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Kibana — Log visualisation and exploration
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: campus_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in .env}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Filebeat — Log shipper (Docker → Logstash)
  # ---------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: campus_filebeat
    restart: unless-stopped
    user: root
    entrypoint: >
      /bin/sh -c "
        cp /tmp/filebeat-src/filebeat.yml /usr/share/filebeat/filebeat.yml &&
        chmod 600 /usr/share/filebeat/filebeat.yml &&
        chown root:root /usr/share/filebeat/filebeat.yml &&
        /usr/bin/tini -- /usr/local/bin/docker-entrypoint -e
      "
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/tmp/filebeat-src/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - campus_net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  campus_net:
    driver: bridge
