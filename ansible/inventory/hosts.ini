# =============================================================================
# ansible/inventory/hosts.ini — Ansible Inventory
#
# This file is overwritten by cd.yml during automated deployments.
# Fill in manually for local/manual runs.
#
# Usage:
#   Replace <EC2_PUBLIC_IP> with the IP from `terraform output ec2_public_ip`
#   Replace <PATH_TO_KEY> with the path to your .pem key file
# =============================================================================

[campus_marketplace]
<EC2_PUBLIC_IP> ansible_user=ec2-user ansible_ssh_private_key_file=<PATH_TO_KEY> ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[campus_marketplace:vars]
ansible_python_interpreter=/usr/bin/python3
