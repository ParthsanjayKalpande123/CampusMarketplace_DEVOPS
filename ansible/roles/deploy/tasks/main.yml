---
# =============================================================================
# ansible/roles/deploy/tasks/main.yml
#
# Deploys the Campus Marketplace to the EC2 instance.
#
# Steps:
#   1. Copy docker-compose.prod.yml to the server
#   2. Write production environment variables to .env file
#   3. Authenticate Docker to Amazon ECR
#   4. Pull the specified image tag
#   5. Bring the Compose stack up (rolling restart)
#   6. Prune dangling images to recover disk space
#   7. Confirm the health endpoint responds
#
# Required vars (from playbook --extra-vars):
#   ecr_registry, ecr_repository, image_tag, aws_region,
#   jwt_secret, mongodb_uri, cors_origin, mongo_root_password
# =============================================================================

# ---------------------------------------------------------------------------
# Step 1 — Copy compose file and monitoring config to server
# ---------------------------------------------------------------------------

- name: Copy monitoring directory to server
  ansible.builtin.copy:
    src:   "{{ playbook_dir }}/../../monitoring"
    dest:  "{{ app_dir }}/"
    owner: ec2-user
    group: ec2-user
  tags: deploy

- name: Copy docker-compose.prod.yml to server
  ansible.builtin.copy:
    src:   "{{ playbook_dir }}/../docker-compose.prod.yml"
    dest:  "{{ app_dir }}/docker-compose.prod.yml"
    owner: ec2-user
    group: ec2-user
    mode:  "0644"
  tags: deploy

# ---------------------------------------------------------------------------
# Step 2 — Write .env file (never logged — no_log: true)
# ---------------------------------------------------------------------------

- name: Write production environment file
  ansible.builtin.copy:
    content: |
      # Auto-generated by Ansible — do not edit manually
      ECR_REGISTRY={{ ecr_registry }}
      ECR_REPOSITORY={{ ecr_repository }}
      IMAGE_TAG={{ image_tag }}

      NODE_ENV=production
      PORT={{ app_port }}

      MONGODB_URI={{ mongodb_uri }}

      JWT_SECRET={{ jwt_secret }}
      JWT_EXPIRES_IN=7d

      COOKIE_SECURE=true
      COOKIE_SAME_SITE=strict

      CORS_ORIGIN={{ cors_origin }}

      MONGO_ROOT_USER={{ mongo_root_user }}
      MONGO_ROOT_PASSWORD={{ mongo_root_password }}

      LOG_LEVEL=warn
    dest:  "{{ app_dir }}/.env"
    owner: ec2-user
    group: ec2-user
    mode:  "0600"   # Owner-read-only — secrets protection
  no_log: true       # Prevent secret values from appearing in Ansible output
  tags: deploy

# ---------------------------------------------------------------------------
# Step 3 — ECR authentication
# ---------------------------------------------------------------------------

- name: Verify EC2 instance identity for ECR access
  ansible.builtin.command: aws sts get-caller-identity
  become_user: ec2-user
  changed_when: false
  tags: deploy

- name: Authenticate Docker to Amazon ECR
  ansible.builtin.shell: |
    aws ecr get-login-password --region {{ aws_region }} | \
    docker login --username AWS --password-stdin {{ ecr_registry }}
  become_user: ec2-user
  changed_when: true   # Always re-auth (ECR tokens expire after 12h)
  no_log: true
  tags: deploy

# ---------------------------------------------------------------------------
# Step 4 — Pull the new image
# ---------------------------------------------------------------------------

- name: Pull Docker image from ECR
  ansible.builtin.command: >
    docker pull {{ ecr_registry }}/{{ ecr_repository }}:{{ image_tag }}
  become_user: ec2-user
  changed_when: true
  tags: deploy

# ---------------------------------------------------------------------------
# Step 5 — Bring stack up (creates or recreates containers as needed)
# ---------------------------------------------------------------------------

- name: Start / update application stack with Docker Compose
  ansible.builtin.shell: |
    set -a
    source {{ app_dir }}/.env
    set +a
    docker compose -f {{ app_dir }}/docker-compose.prod.yml pull
    docker compose -f {{ app_dir }}/docker-compose.prod.yml \
      up -d --remove-orphans --pull never
  become_user: ec2-user
  changed_when: true
  tags: deploy

# ---------------------------------------------------------------------------
# Step 6 — Prune dangling images
# ---------------------------------------------------------------------------

- name: Remove dangling Docker images (disk cleanup)
  ansible.builtin.command: docker image prune -f
  become_user: ec2-user
  changed_when: false
  tags: deploy

# ---------------------------------------------------------------------------
# Step 7 — Health check (wait up to 60s for the app to become ready)
# ---------------------------------------------------------------------------

- name: Wait for application to become healthy
  ansible.builtin.uri:
    url:            "http://localhost:{{ app_port }}/api/v1/health"
    method:         GET
    status_code:    200
    timeout:        10
  become: false
  register:  health_result
  retries:   6
  delay:     10
  until:     health_result.status == 200
  tags: deploy

- name: Display health check result
  ansible.builtin.debug:
    msg: "Health check passed — {{ health_result.json }}"
  tags: deploy
