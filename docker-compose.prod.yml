# =============================================================================
# docker-compose.prod.yml — Production Deployment
#
# Used by Ansible on the EC2 instance after Terraform provisions infrastructure.
#
# This file uses a pre-built image pulled from Amazon ECR instead of building
# from source. All sensitive values come from environment variables injected
# by Ansible from the EC2 instance's environment or a secrets file.
#
# Usage (run by Ansible):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#
# Required env vars (set by Ansible):
#   ECR_REGISTRY    — e.g. 123456789012.dkr.ecr.ap-south-1.amazonaws.com
#   ECR_REPOSITORY  — e.g. campus-marketplace
#   IMAGE_TAG       — e.g. latest or a git SHA
#   MONGODB_URI     — mongodb://mongodb:27017/campus_marketplace  (internal)
#   JWT_SECRET      — strong random 64-char string
#   CORS_ORIGIN     — e.g. https://your-domain.com
#   GEMINI_API_KEY  — optional; enables Gemini-powered marketplace features
# =============================================================================

x-app-common: &app-common
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 400m
    memswap_limit: 768m
    environment:
      NODE_ENV:        production
      PORT:            3000
      ADMIN_PORT:      3001
      MONGODB_URI:     ${MONGODB_URI}
      JWT_SECRET:      ${JWT_SECRET}
      JWT_EXPIRES_IN:  ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE:   ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: strict
      CORS_ORIGIN:     ${CORS_ORIGIN}
      GEMINI_API_KEY:  ${GEMINI_API_KEY:-}
      GEMINI_MODEL:    ${GEMINI_MODEL:-gemini-3.8-flash}
      LOG_LEVEL:       warn
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campus_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # Application slots — BLUE serves users on 3000; GREEN is tested on localhost
  # ---------------------------------------------------------------------------
  app:
    <<: *app-common
    container_name: campus_marketplace_app
    ports:
      - "3000:3000"
      - "3001:3001"

  app-green:
    <<: *app-common
    container_name: campus_marketplace_app_green
    ports:
      - "127.0.0.1:3002:3000"

  # ---------------------------------------------------------------------------
  # MongoDB 7 — Production storage with authentication
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7-jammy
    container_name: campus_marketplace_mongo
    restart: unless-stopped
    mem_limit: 450m
    memswap_limit: 768m
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-cmadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Never expose MongoDB port on production host
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 30s
    networks:
      - campus_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: campus_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Grafana — Metrics visualisation dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: campus_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Elasticsearch — Log storage for ELK stack
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: campus_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type:            single-node
      xpack.security.enabled:    "false"
      ES_JAVA_OPTS:              "-Xms2g -Xmx2g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - campus_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Logstash — Log processing pipeline
  # ---------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: campus_logstash
    restart: unless-stopped
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Kibana — Log visualisation and exploration
  # ---------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: campus_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - campus_net

  # ---------------------------------------------------------------------------
  # Filebeat — Log shipper (Docker → Logstash)
  # ---------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: campus_filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - campus_net

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  campus_net:
    driver: bridge
